name: Seed repository suggestion
description: Suggest a repository for OpenClaw Marketing Lab to analyze.
title: "Seed repo: <owner/repo>"
labels: [seed-repo]
body:
  - type: input
    id: repo_url
    attributes:
      label: Repository URL
      placeholder: https://github.com/owner/repo
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why is this useful for marketing/GTM systems?
    validations:
      required: true
  - type: textarea
    id: capability
    attributes:
      label: What reusable capability should be extracted?
    validations:
      required: false
